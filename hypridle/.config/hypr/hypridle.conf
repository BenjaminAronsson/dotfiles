# hypridle — what happens when the machine is left alone.
#
# Shared by every machine. The locker differs per machine (noctalia on the
# laptop, hyprlock on the desktop), so everything here goes through
# scripts/lock.sh, which picks whichever one is installed.
#
# Timeline, measured from last input:
#   5m00s  dim the backlight       (restored instantly on any input)
#   5m30s  lock
#   5m50s  screens off
#   2h00s  suspend
#
# To suspend these timers temporarily (presentations, long builds) use the
# noctalia caffeine toggle, or `systemd-inhibit --what=idle sleep 3h`.

general {
  lock_cmd = $HOME/.config/hypr/scripts/lock.sh
  before_sleep_cmd = loginctl lock-session
  after_sleep_cmd = hyprctl dispatch dpms on
  ignore_dbus_inhibit = false
}

# Dim the backlight as a warning shot. brightnessctl -s saves the current
# level so that -r can put it back exactly.
listener {
  timeout = 300
  on-timeout = brightnessctl -s set 10
  on-resume = brightnessctl -r
}

# Lock 30s after dimming, so a nudge within that window cancels it.
listener {
  timeout = 330
  on-timeout = loginctl lock-session
}

# Screens off shortly after locking.
listener {
  timeout = 350
  on-timeout = hyprctl dispatch dpms off
  on-resume = hyprctl dispatch dpms on
}

# Suspend after two hours. Deliberately long: docked at a desk you rarely want
# it, and on battery the firmware steps in well before this matters.
listener {
  timeout = 7200
  on-timeout = systemctl suspend
}
