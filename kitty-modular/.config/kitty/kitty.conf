# kitty — laptop profile.
#
# Colours come from noctalia, which regenerates themes/noctalia.conf whenever
# the wallpaper palette changes. That file is generated, so it is deliberately
# NOT tracked in this repo — only this kitty.conf is stowed, and ~/.config/kitty
# stays a real directory so noctalia has somewhere to write.
#
# The desktop machine uses kitty-classic instead, themed Catppuccin Mocha.

# MesloLGL is what this machine actually has (ttf-meslo-nerd). The desktop uses
# CaskaydiaCove; to match it here, install ttf-cascadia-code-nerd and swap the
# family below to "CaskaydiaCove Nerd Font Mono".
font_family MesloLGL Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 12

background_opacity 0.7
background_blur 0

confirm_os_window_close 0

include themes/noctalia.conf
