# kitty — laptop profile.
#
# Colours come from noctalia, which regenerates themes/noctalia.conf whenever
# the wallpaper palette changes. That file is generated, so it is deliberately
# NOT tracked in this repo — only this kitty.conf is stowed, and ~/.config/kitty
# stays a real directory so noctalia has somewhere to write.
#
# The desktop machine uses kitty-classic instead, themed Catppuccin Mocha.

font_family CaskaydiaCove Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 12

background_opacity 0.9
background_blur 16

confirm_os_window_close 0

include themes/noctalia.conf
