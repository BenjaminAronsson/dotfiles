# Sleep tuning. Installed to /etc/systemd/sleep.conf.d/ by
# `make install-systemd` — system config, not stowed.
#
# How long suspend-then-hibernate stays suspended before writing the
# hibernation image. Harmless where hibernation is unavailable: the setting is
# simply never reached, because nothing invokes suspend-then-hibernate there.
# See logind.conf.d/80-laptop.conf for how to enable hibernation.

[Sleep]
HibernateDelaySec=30min
