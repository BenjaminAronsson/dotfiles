# Lid switch policy. Installed to /etc/systemd/logind.conf.d/ by
# `make install-systemd` — this is system config, so it is not stowed.
#
# HandleLidSwitchDocked=ignore is the important line: it stops logind
# suspending the machine when the lid is closed while an external monitor is
# connected, which is what lets the compositor-side handling in
# hypr-modular/.config/hypr/config/liddock.lua move workspaces to the external
# instead of the session going to sleep.
#
# The undocked actions are `suspend` rather than `suspend-then-hibernate`
# because hibernation is not currently available on the laptop: its only swap
# is zram, which lives in RAM and so cannot hold a hibernation image, and there
# is no resume= kernel parameter. logind reports CanHibernate=na there.
#
# To switch to suspend-then-hibernate, first make hibernation work:
#   1. add disk-backed swap at least the size of RAM (32G here)
#   2. add resume=<swap device or UUID>, plus resume_offset= for a swapfile,
#      to the kernel command line
#   3. add the `resume` hook to mkinitcpio.conf and regenerate the initramfs
#   4. confirm with:
#        busctl call org.freedesktop.login1 /org/freedesktop/login1 \
#            org.freedesktop.login1.Manager CanHibernate
# then change the two lines below and re-run `make install-systemd`.

[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
