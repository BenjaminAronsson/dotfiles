# AirPlay/RAOP speakers as ordinary system outputs.
#
# Without this, network speakers are reachable only from apps that speak Cast
# themselves (Spotify, VLC, Chrome), and never appear in the Sound Output list,
# so you cannot send *system* audio to them.
#
# module-raop-discover watches mDNS for _raop._tcp and spawns a raop-sink per
# device it finds. The sinks appear and disappear with the speakers -- nothing
# here names a specific device or IP, so it keeps working when they move.
#
# The living-room speakers advertise both Cast and AirPlay. AirPlay is used
# because PipeWire implements it natively; the Cast route needs a third-party
# daemon (pulseaudio-dlna) that transcodes to MP3. AirPlay also reaches the
# Sonos and the left speaker of the pair, neither of which advertises Cast.
#
# Requires the module to exist: `pipewire-zeroconf` on Arch. If it is missing
# PipeWire logs a "module not found" warning at startup and carries on.
#
# Upstream ships this same snippet at
# /usr/share/pipewire/pipewire.conf.avail/50-raop.conf; it is inlined rather
# than symlinked because that path is distro-specific.
context.modules = [
    { name = libpipewire-module-raop-discover
        condition = [ { module.raop = !false } ]
    }
]
