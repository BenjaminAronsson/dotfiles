# Catppuccin Mocha variant for sddm-astronaut-theme.
#
# The upstream theme (AUR: sddm-astronaut-theme) ships ten variants in its
# Themes/ directory, none of which is Catppuccin. This is a hand-written
# eleventh, using the same palette as hyprmocha/mocha.conf so the greeter
# matches the rest of the stack.
#
# Deployed by `make install-sddm` from the repo root. Do not edit the copy
# under /usr/share -- edit this file and re-run the target.

[General]
#################### General ####################

# Deliberately blank, so Main.qml falls back to the real screen size.
#
# These are not hints -- Main.qml assigns them directly to the root Pane's
# width and height, ignoring the actual display. Any fixed value is wrong on
# this machine: undocked the panel is 1920x1200, docked the X screen spans
# three monitors. A canvas smaller than the screen renders as black around
# the greeter.
#
# Leaving them blank only works because `make install-sddm` also repairs an
# upstream typo on Main.qml line 18, which reads `Screen.ScreenWidth` -- not
# a real QML property, so the width fallback evaluates to undefined.
ScreenWidth=""
ScreenHeight=""
ScreenPadding=""

# MesloLGL is what kitty-modular uses on this machine and is provided by
# ttf-meslo-nerd, which is installed. Deliberately NOT JetBrainsMono: that
# font is referenced by hyprlock.conf but is not installed on this host.
Font="MesloLGL Nerd Font"
FontSize=""

KeyboardSize="0.4"

# Matches input-field rounding = 8 in hyprlock.conf.
RoundCorners="8"

Locale=""
# Both formats mirror the hyprlock labels: "21:37" / "Monday, 27 July 2026".
HourFormat="HH:mm"
DateFormat="dddd, d MMMM yyyy"

HeaderText=""

#################### Background ####################

BackgroundPlaceholder=""
# Copied into the theme's Backgrounds/ by `make install-sddm`. It cannot be
# read from ~/.config/backgrounds directly: /home/benjamin is mode 700 and
# the greeter runs as the unprivileged `sddm` user before login, so it has
# no way to traverse into the home directory. A path under /usr/share is
# root-owned and world-readable, which is what the greeter needs.
Background="Backgrounds/nice-blue-background.png"
BackgroundSpeed=""
PauseBackground=""
DimBackground="0.0"
CropBackground="true"
BackgroundHorizontalAlignment="center"
BackgroundVerticalAlignment="center"

#################### Colors ####################
# Catppuccin Mocha, values taken verbatim from
# hyprmocha/.config/hypr/mocha.conf.

# text / subtext0
HeaderTextColor="#cdd6f4"
DateTextColor="#a6adc8"
TimeTextColor="#cdd6f4"

# base / crust
FormBackgroundColor="#1e1e2e"
BackgroundColor="#1e1e2e"
DimBackgroundColor="#11111b"

# surface0 for field fills, matching hyprlock's inner_color = $surface0
LoginFieldBackgroundColor="#313244"
PasswordFieldBackgroundColor="#313244"
LoginFieldTextColor="#cdd6f4"
PasswordFieldTextColor="#cdd6f4"

# mauve is the accent throughout, as in hyprlock ($accent = $mauve)
UserIconColor="#cba6f7"
PasswordIconColor="#cba6f7"

# overlay0 reads as clearly secondary without vanishing
PlaceholderTextColor="#6c7086"
# red, matching hyprlock's fail_color = $red
WarningColor="#f38ba8"

# Dark base text on a mauve fill: the one high-contrast element on screen.
LoginButtonTextColor="#1e1e2e"
LoginButtonBackgroundColor="#cba6f7"
SystemButtonsIconsColor="#cdd6f4"
SessionButtonTextColor="#a6adc8"
VirtualKeyboardButtonTextColor="#a6adc8"

# mantle sits just under base, so the dropdown separates from the form
DropdownTextColor="#cdd6f4"
DropdownSelectedBackgroundColor="#cba6f7"
DropdownBackgroundColor="#181825"

HighlightTextColor="#1e1e2e"
HighlightBackgroundColor="#cba6f7"
HighlightBorderColor="#cba6f7"

# pink is one step off mauve: hover is visible but not a colour change.
HoverUserIconColor="#f5c2e7"
HoverPasswordIconColor="#f5c2e7"
HoverSystemButtonsIconsColor="#f5c2e7"
HoverSessionButtonTextColor="#f5c2e7"
HoverVirtualKeyboardButtonTextColor="#f5c2e7"

#################### Form ####################

# hyprlock blurs the whole wallpaper (blur_passes = 2), so full blur is the
# closer match. BlurMax/Blur are set to the values the upstream config
# recommends whenever FullBlur is enabled.
PartialBlur="false"
FullBlur="true"
BlurMax="64"
Blur="1.0"

# False, so the form is transparent and the time, date and input field float
# directly on the blurred wallpaper -- which is what hyprlock does. Setting
# this true draws a solid FormBackgroundColor panel behind the form, and
# because that colour is $base (#1e1e2e) it reads as a black box on screen.
HaveFormBackground="false"
FormPosition="center"

#################### Virtual Keyboard ####################

VirtualKeyboardPosition="center"

#################### Interface Behavior ####################

HideVirtualKeyboard="false"
HideSystemButtons="false"
HideLoginButton="false"

# Log in with the account name, not the GECOS real name -- unambiguous.
UseRealName="false"

ForceLastUser="true"
PasswordFocus="true"
HideCompletePassword="true"
AllowEmptyPassword="false"
# This machine has zram-only swap and cannot hibernate, so leave the checks
# on: sddm will then hide the hibernate button instead of offering an action
# that silently fails.
BypassSystemButtonsChecks="false"
RightToLeftLayout="false"

#################### Translation ####################

# Matches the hyprlock placeholder text.
TranslatePlaceholderUsername=""
TranslatePlaceholderPassword="Password…"
TranslateLogin=""
TranslateLoginFailedWarning=""
TranslateCapslockWarning=""
TranslateSuspend=""
TranslateHibernate=""
TranslateReboot=""
TranslateShutdown=""
TranslateSessionSelection=""
TranslateVirtualKeyboardButtonOn=""
TranslateVirtualKeyboardButtonOff=""
