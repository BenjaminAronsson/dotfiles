# Point SDDM at the astronaut theme.
#
# This is the fix for the default greeter: /etc/sddm.conf had no [Theme]
# section at all, and with no theme configured SDDM falls back to a bare
# built-in Qt form -- grey background, system default font. It was never
# broken, just unstyled.
#
# Kept as a drop-in rather than an edit to /etc/sddm.conf because SDDM reads
# /etc/sddm.conf first and then /etc/sddm.conf.d/*.conf in alphabetical
# order, with later files winning. That leaves the existing [Autologin]
# section in /etc/sddm.conf untouched and makes this change trivial to
# revert -- delete the file.
#
# Deployed by `make install-sddm` from the repo root.

[Theme]
Current=sddm-astronaut-theme
